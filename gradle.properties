# v5.7.36 fix (2026-11-24): CI run #97 failed because this project had NO
# gradle.properties, so AGP 8.5.2 defaulted android.useAndroidX to false
# (true-by-default only from AGP 9.0.0) — and v5.7.36 is the first version
# to use AndroidX (androidx.work:work-runtime:2.9.0). AGP refuses to build
# with AndroidX dependencies unless this flag is true:
# "This project uses AndroidX dependencies, but the 'android.useAndroidX'
# property is not enabled. Set this property to true in the gradle.properties
# file and retry."
android.useAndroidX=true
android.enableJetifier=true
