<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Solo Leveling System - Quest Dashboard</title>
<!-- v5.3: fully offline — no webfont links; system fonts are used. -->
<style>
  :root{
    --cyan:#00f5ff;
    --cyan-dim:#7deeff;
    --cyan-bright:#a5f3ff;
    --glow:rgba(0,245,255,.4);
    --glow-strong:rgba(0,245,255,.95);
    --green:#2ee6a8;
    --gold:#f5b942;
    --red:#ff4d5e;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 480px at 50% -10%, rgba(0,245,255,.14), transparent 60%),
      linear-gradient(180deg,#010409 0%,#020a18 55%,#010409 100%);
    color:#fff;
    font-family:"Rajdhani",system-ui,sans-serif;
    min-height:100vh;padding:18px 14px;
  }
  /* Anime System circuit — faint diagonal tech lines over a fine
     grid, like the Pinterest reference windows. Pure CSS. */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,245,255,.07) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(-45deg, rgba(0,245,255,.05) 0 1px, transparent 1px 110px),
      linear-gradient(rgba(0,245,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,.06) 1px, transparent 1px);
    background-size:auto,auto,46px 46px,46px 46px;
  }
  .en{font-family:"Rajdhani",sans-serif;letter-spacing:.14em;text-transform:uppercase}
  .db-wrap{position:relative;max-width:430px;width:100%;margin:0 auto;z-index:1}
  .back{
    display:inline-block;margin-bottom:12px;background:transparent;
    border:1px solid rgba(125,249,255,.65);color:var(--cyan);
    font-family:"Rajdhani",sans-serif;font-weight:700;font-size:14px;letter-spacing:.22em;
    padding:8px 16px;cursor:pointer;text-shadow:0 0 10px rgba(0,245,255,.8);
  }
  /* Anime System window: thin glowing cyan-white DOUBLE border
     (border + outer hairline) with bright corner accents and an
     outer blue glow. Translucent, so the circuit grid shines through. */
  .win{
    position:relative;
    background-image:
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(var(--cyan-bright),var(--cyan-bright)),
      linear-gradient(180deg,rgba(4,14,28,.62),rgba(2,8,20,.62));
    background-size:
      26px 3px, 3px 26px,
      26px 3px, 3px 26px,
      26px 3px, 3px 26px,
      26px 3px, 3px 26px,
      100% 100%;
    background-position:
      left top, left top,
      right top, right top,
      left bottom, left bottom,
      right bottom, right bottom,
      center;
    background-repeat:no-repeat;
    background-origin:border-box;
    border:1px solid rgba(165,243,255,.9);
    outline:1px solid rgba(0,245,255,.28);
    outline-offset:4px;
    box-shadow:0 0 28px rgba(0,245,255,.22), 0 0 60px rgba(0,120,255,.12), inset 0 0 30px rgba(0,245,255,.06);
    padding:20px 16px 18px 46px;text-align:center;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  /* Vertical label BOX on the left (from the photos): a bordered
     box with glowing vertical text, and below it a square box with
     a glowing "!" in a circle. */
  .vlab{position:absolute;left:10px;top:14px;bottom:14px;width:32px;display:flex;flex-direction:column;gap:10px;z-index:1;pointer-events:none}
  .vlab-box{flex:1;border:1px solid rgba(125,249,255,.8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,245,255,.25), inset 0 0 10px rgba(0,245,255,.08);background:rgba(0,245,255,.04)}
  .vlab-box span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:"Rajdhani",sans-serif;font-weight:700;font-size:15px;letter-spacing:.34em;color:var(--cyan);text-shadow:0 0 12px var(--glow-strong);text-transform:uppercase;white-space:nowrap}
  .vlab-excl{flex:none;width:32px;height:32px;border:1px solid rgba(125,249,255,.8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(0,245,255,.25)}
  .vlab-excl i{font-style:normal;width:22px;height:22px;border:1px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px var(--glow-strong)}
  /* Red is only for the word "penalty" (photo spec). */
  .pen{color:var(--red);text-shadow:0 0 8px rgba(255,77,94,.7)}
  .db-head{display:flex;align-items:center;gap:10px}
  .db-excl{
    width:40px;height:40px;flex:none;border:1px solid var(--cyan);color:var(--cyan);
    font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
    text-shadow:0 0 12px var(--glow-strong);box-shadow:0 0 12px var(--glow);
  }
  /* The "!" sits in a glowing circle inside its square box (photos). */
  .db-excl i{font-style:normal;width:24px;height:24px;border:1px solid var(--cyan);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
  .db-head h2{
    flex:1;margin:0;font-size:21px;font-weight:700;color:var(--cyan);letter-spacing:.16em;text-align:center;
    text-shadow:0 0 14px var(--glow-strong);border:1px solid var(--cyan);padding:6px 10px;
    box-shadow:0 0 12px var(--glow), inset 0 0 8px rgba(0,245,255,.15);
  }
  .db-line{margin-top:16px;font-size:15px;color:var(--cyan-dim);line-height:1.5}
  .db-goal{
    margin:18px 0 6px;font-size:22px;font-weight:700;color:var(--cyan);letter-spacing:.16em;
    text-shadow:0 0 14px var(--glow-strong);text-decoration:underline;text-underline-offset:5px;
  }
  /* NOTIFICATION band: bordered glowing bar, like the photos. */
  .db-notifbar{
    display:flex;align-items:center;justify-content:center;margin:16px 0 10px;
    border:1px solid var(--cyan);padding:7px 10px;
    box-shadow:0 0 12px var(--glow), inset 0 0 8px rgba(0,245,255,.15);
  }
  .db-notifbar h3{
    margin:0;font-size:19px;font-weight:700;color:#fff;letter-spacing:.14em;
    text-shadow:0 0 14px var(--glow-strong);white-space:nowrap;
  }
  .db-note{text-align:center;color:#7df9ff;font-size:17px;line-height:1.6;text-shadow:0 0 12px rgba(0,245,255,.9)}
  .db-div{
    height:1px;margin:14px 0;
    background:linear-gradient(90deg,transparent,rgba(0,245,255,.5),transparent);
  }
  .db-row{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;font-size:16.5px;font-weight:600}
  .db-row .qv{font-family:"Share Tech Mono",monospace;color:var(--cyan-dim);font-size:15.5px}
  .db-row .qb{color:var(--cyan-dim);font-size:17px;margin-left:10px}
  .db-row.done .qv{color:var(--green)}
  .db-row.done .qb{color:var(--green)}
  .db-row.done span:first-child{color:var(--green)}
  .db-warnrow{display:flex;align-items:flex-start;gap:10px;margin-top:14px}
  .db-warnrow .qb{
    color:var(--cyan);font-size:22px;line-height:1.2;flex:none;margin-top:2px;
    text-shadow:0 0 10px var(--glow-strong);
  }
  .db-warnrow .qw{flex:1;font-size:15px;line-height:1.55;color:var(--cyan-dim);text-align:center}
  .db-warnrow .qw b{color:var(--cyan);text-shadow:0 0 10px var(--glow-strong)}
  /* v5.3 photo spec: big LEVEL number left, JOB / TITLE lines right. */
  .db-status-top{display:flex;gap:18px;align-items:center;margin-top:10px;text-align:left}
  .db-levelbig{flex:none;text-align:center}
  .db-levelbig .lv{font-family:"Rajdhani",sans-serif;font-size:64px;font-weight:700;line-height:1;color:#fff;text-shadow:0 0 22px rgba(0,245,255,.8)}
  .db-levelbig .lvlabel{font-size:11px;letter-spacing:.3em;color:var(--cyan);margin-top:2px}
  .db-joblines{flex:1;font-size:16.5px;font-weight:600;color:#fff;line-height:1.9}
  .db-joblines span{color:var(--cyan-dim)}
  .db-bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
  .db-bar{display:flex;align-items:center;gap:8px;font-size:14px}
  .db-bar .bl{font-family:"Rajdhani",sans-serif;font-weight:700;letter-spacing:.1em;color:#fff;flex:none}
  .bar{flex:1;height:10px;background:transparent;border:1px solid rgba(0,245,255,.45);overflow:hidden}
  .bar>i{display:block;height:100%;width:0%}
  .db-hp>i{background:linear-gradient(90deg,#00e5ff,#7df9ff);box-shadow:0 0 10px rgba(0,245,255,.7)}
  .db-mp>i{background:linear-gradient(90deg,#0077ff,#00b8d4);box-shadow:0 0 10px rgba(0,119,255,.7)}
  .db-fatigue{font-size:14px;color:#fff;align-self:center}
  /* v5.3 photo spec: 5-stat grid STR / AGI / VIT / INT / PER with
     small icons. FAITH and TRADE stay on the main screen. */
  .db-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .db-stats span{font-size:14px;font-weight:600;color:#fff;text-align:center}
  .db-stats i{font-style:normal;display:block;font-size:17px;margin-bottom:3px}
  .db-ap{margin-top:12px;text-align:center;font-size:15.5px;color:#fff}
</style>
</head>
<body>
  <div class="db-wrap">
    <button class="back en" type="button" id="backBtn">‹ Back</button>
    <div class="win">
      <div class="vlab" aria-hidden="true"><div class="vlab-box"><span>Status</span></div><div class="vlab-excl"><i>!</i></div></div>
      <div class="db-head">
        <span class="db-excl"><i>!</i></span>
        <h2 class="en">Quest Info</h2>
      </div>
      <div class="db-line">[Daily Quest: Strength Training has arrived.]</div>
      <div class="db-notifbar">
        <h3 class="en">Notification</h3>
      </div>
      <div id="notifLines"></div>
      <div class="db-div"></div>
      <div class="db-goal">GOAL</div>
      <div id="goalRows"></div>
      <div class="db-warnrow"><span class="qb">☑</span><span class="qw"><b>WARNING:</b> Failure to complete the daily quest will result in an appropriate <span class="pen">penalty</span>.</span></div>
      <div class="db-div"></div>
      <div class="db-goal">STATUS</div>
      <div class="db-status-top">
        <div class="db-levelbig"><div class="lv" id="stLevelNum">1</div><div class="lvlabel">LEVEL</div></div>
        <div class="db-joblines">
          <div>JOB: <span id="stJob">Daily System Player</span></div>
          <div>TITLE: <span id="stTitle">Novice Hunter</span></div>
        </div>
      </div>
      <div class="db-bars">
        <div class="db-bar"><span class="bl">HP</span><div class="bar db-hp"><i id="hpBar"></i></div><span id="hpText" style="font-size:13px;color:#fff"></span></div>
        <div class="db-bar"><span class="bl">MP</span><div class="bar db-mp"><i id="mpBar"></i></div><span id="mpText" style="font-size:13px;color:#fff"></span></div>
        <div class="db-bar"><span class="bl">FAT</span><div class="bar" style="visibility:hidden"><i></i></div></div>
        <div class="db-fatigue" id="fatText">FATIGUE: 0</div>
      </div>
      <div class="db-stats" id="statRow"></div>
      <div class="db-ap" id="apText">Available Ability Points: 0</div>
    </div>
  </div>
<script>
(function(){
  "use strict";
  function todayKey(){
    try{
      return new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Addis_Ababa",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    }catch(e){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
  }
  /* v5.3: the dashboard shows his REAL state, read live from the
     same save the main screen writes (soloLevelingSaveV4).
     Fallback = his real state on 2026-11-08 (Level 1, XP 38/100,
     HP 86/100, MP 120/120, STR 14, INT 14, FAITH 19, TRADE 10,
     streak 3, 4 quests done, 6/18 titles) — used ONLY if the save
     cannot be read. The anime's numbers (Level 18, STR 48, HP
     220/220) are never used. */
  var SAVE_KEY="soloLevelingSaveV4";
  var BASE={str:12,int:14,faith:16,trade:10,disc:11,skill:9,vit:10,agi:10,per:10};
  var FALLBACK={level:1,xp:38,totalXp:38,hp:86,doneCount:4,streak:3,
    questState:{fajr:"done",saitamaEx:"done",saitamaRun:"done",breakfast:"done"},
    questDay:{fajr:"2026-11-08",saitamaEx:"2026-11-08",saitamaRun:"2026-11-08",breakfast:"2026-11-08"},
    statBonus:{str:2,int:0,faith:3,trade:0,disc:0,skill:0,vit:0,agi:0,per:0},
    unlocked:{first:1,five:1,gym:1,faith:1,streak3:1,early:1},bonusAP:0};
  function loadSave(){
    try{
      var raw=localStorage.getItem(SAVE_KEY);
      if(!raw) return null;
      var d=JSON.parse(raw);
      return (d&&d.state)?d.state:null;
    }catch(e){ return null; }
  }
  var s=loadSave()||FALLBACK;
  var today=todayKey();
  var level=s.level||1, xp=s.xp||0, need=level*100;
  var hp=(s.hp===undefined||s.hp===null)?100:s.hp;
  function stat(k){ return BASE[k]+((s.statBonus&&s.statBonus[k])||0); }
  var mpMax=50+5*stat("int");
  var fat=0;
  if(s.questState){
    Object.keys(s.questState).forEach(function(id){
      if(s.questState[id]==="missed"&&s.questDay&&s.questDay[id]===today) fat++;
    });
  }
  var ap=(level-1)*3+(s.bonusAP||0);
  function rankTitle(lv){
    if(lv>=60) return "Shadow Monarch";
    if(lv>=30) return "Wolf Assassin";
    if(lv>=20) return "National Level Hunter";
    if(lv>=10) return "S-Rank Hunter";
    if(lv>=7) return "A-Rank Hunter";
    if(lv>=5) return "B-Rank Hunter";
    if(lv>=3) return "C-Rank Hunter";
    if(lv>=2) return "D-Rank Hunter";
    return "Novice Hunter";
  }
  function doneToday(id){
    return !!(s.questState&&s.questState[id]==="done"&&s.questDay&&s.questDay[id]===today);
  }
  /* NOTIFICATION — real System lines only. */
  var lines=["[You've become a Player.]","[Daily Quest: Strength Training has arrived.]"];
  var ups=Math.min(level-1,4);
  for(var i=0;i<ups;i++) lines.push("Leveled up!");
  if(ups===0) lines.push("Streak: "+(s.streak||0)+" day"+((s.streak||0)===1?"":"s")+" — Quests done today: "+(s.doneCount||0));
  var nl=document.getElementById("notifLines");
  lines.forEach(function(t){
    var d=document.createElement("div"); d.className="db-note"; d.textContent=t; nl.appendChild(d);
  });
  /* GOAL — live Saitama progress today. */
  var goals=[
    {name:"Push-ups", val:doneToday("saitamaEx")?"100/100":"0/100", done:doneToday("saitamaEx")},
    {name:"Sit-ups", val:doneToday("saitamaEx")?"100/100":"0/100", done:doneToday("saitamaEx")},
    {name:"Squats", val:doneToday("saitamaEx")?"100/100":"0/100", done:doneToday("saitamaEx")},
    {name:"Running", val:doneToday("saitamaRun")?"10/10km":"0/10km", done:doneToday("saitamaRun")}
  ];
  var gr=document.getElementById("goalRows");
  goals.forEach(function(g){
    var d=document.createElement("div");
    d.className="db-row"+(g.done?" done":"");
    d.innerHTML="<span>"+g.name+"</span><span><span class=\"qv\">["+g.val+"]</span><span class=\"qb\">"+(g.done?"☑":"☐")+"</span></span>";
    gr.appendChild(d);
  });
  /* STATUS — real values. */
  document.getElementById("stLevelNum").textContent=level;
  document.getElementById("stTitle").textContent=rankTitle(level);
  document.getElementById("hpBar").style.width=Math.max(0,Math.min(100,hp))+"%";
  document.getElementById("hpText").textContent=hp+" / 100";
  document.getElementById("mpBar").style.width="100%";
  document.getElementById("mpText").textContent=mpMax+" / "+mpMax;
  document.getElementById("fatText").textContent="FATIGUE: "+fat;
  var sr=document.getElementById("statRow");
  /* v5.3 photo spec: 5-stat grid STR / AGI / VIT / INT / PER with
     small icons. FAITH and TRADE stay on the main screen. */
  [["STR","💪",stat("str")],["AGI","👟",stat("agi")],["VIT","❤️",stat("vit")],["INT","🧠",stat("int")],["PER","👁️",stat("per")]].forEach(function(p){
    var sp=document.createElement("span");
    sp.innerHTML="<i>"+p[1]+"</i>"+p[0]+": "+p[2];
    sr.appendChild(sp);
  });
  document.getElementById("apText").textContent="Available Ability Points: "+ap;
  document.getElementById("backBtn").addEventListener("click", function(){ history.back(); });
})();
</script>
</body>
</html>
