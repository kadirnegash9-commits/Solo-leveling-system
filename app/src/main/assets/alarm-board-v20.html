  .kader-notif-overlay {
    position: fixed;

       though the CSS was correct — the overlay's height collapsed to
       its content (100vh did not fill the viewport in this WebView),
       so the frame sat at the top. height:100% (a fixed element's
       percentage height resolves against the viewport, chained from
       html/body height:100%) makes the overlay full-height without
       relying on the vh unit. */
    height: 100%;
    /* v5.7.17: min-height fallback — if the WebView ever reports a
       wrong 100vh, the overlay still fills the body (html,body are
       height:100%), so the board can never be stranded at the top
       of a short container. */
    min-height: 100%;
    background: #000000;
    backdrop-filter: blur(4px);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* v5.7.16: boss corrected (12:33) — the board belongs in the

       (justify-content:center). v5.7.15's "top" move was a misread.

    padding: 0 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;

    opacity: 1;
    pointer-events: auto;

  function openKaderNotification(idx) {
    if (idx < 0 || idx >= kaderHabitsList.length) idx = 0;
    currentKaderHabitIdx = idx;
    currentKaderHabit = kaderHabitsList[idx];
    openKaderNotificationWithHabit(currentKaderHabit);
  }
  // v5.7.18: open the board with an arbitrary habit object — used by
  // the title-only path too, so a message/test board replays ITS OWN
  // text instead of falling back to habit 0 (Fajr).
  function openKaderNotificationWithHabit(h) {
    const overlay = document.getElementById('kaderNotifOverlay');
    const frame = document.getElementById('kaderBoardFrame');
    overlay.classList.remove('closing');
    frame.style.animation = 'none';
    void frame.offsetWidth;
    frame.style.animation = '';
    overlay.classList.add('open');

    // v5.7.15: start the anime auto-writing FIRST, then the sound — a
    // sound failure must never block the typing again.
    startAnimeAutoWrite(h);
    try { playAuthenticMp3('open'); } catch (e) {}
  }
  function replayKaderBoardAnimation() {
    // v5.7.18: replay the habit actually on the board — never index 0.
    if (currentKaderHabit) {
      openKaderNotificationWithHabit(currentKaderHabit);
    } else {
      openKaderNotification(currentKaderHabitIdx);
    }
  }
  // v5.7.15: tapping the board itself replays the animation (the
  // REPLAY ANIMATION pill below the board is deleted). Taps on
  // ACCEPT / DECLINE must NOT replay — they decide the quest.
  function kaderBoardTap(e) {
    try {
      if (e && e.target && e.target.closest && e.target.closest('button')) return;
    } catch (err) {}
    replayKaderBoardAnimation();
  }
  function closeKaderNotification(soundKey) {
    const overlay = document.getElementById('kaderNotifOverlay');
    if (!overlay.classList.contains('open')) return;
    clearAutoWriteTimers();
    playAuthenticMp3(soundKey || 'close');
    overlay.classList.add('closing');
    setTimeout(() => {
      overlay.classList.remove('open');
      overlay.classList.remove('closing');
    }, 390);
  }
  function resolveKaderHabit(decision) {
    // v5.7.18: the habit actually on the board (title-only boards
    // have idx -1 — the old code filled in Fajr here on ACCEPT/DECLINE).
    const h = currentKaderHabit || kaderHabitsList[currentKaderHabitIdx];
    clearAutoWriteTimers();
    document.getElementById('kaderLineHeader').innerText = h.header;
    document.getElementById('kaderLineSub1').innerText = h.line1;
    document.getElementById('kaderLineSub2').innerText = h.line2;
    const chk = document.getElementById('kaderCheckBoxIcon');
    chk.classList.add('visible');
    if (decision === 'accept') { chk.innerText = '✓'; }
    try { playSystemSound(decision === 'accept' ? 'accept' : 'decline'); } catch (e) {}
    const overlay = document.getElementById('kaderNotifOverlay');
    overlay.classList.add('closing');
    setTimeout(() => {
      overlay.classList.remove('open');
      overlay.classList.remove('closing');
      if (window.AndroidAlarm && AndroidAlarm.decide) {
        AndroidAlarm.decide(decision === 'accept' ? 'done' : 'missed');
      }
    }, 390);
  }
  window.showAlarmBoard = function(idx, title) {
    initAudio();
    if (typeof idx !== 'number' || idx < 0 || idx >= kaderHabitsList.length) {
      const h = { header: '• [Daily Habits]', line1: '• ' + (title || 'Quest time is here'), line2: '' };
      // v5.7.18: title-only board — keep THIS habit as the current one
      // (idx -1, not 0), so replay and ACCEPT/DECLINE never show Fajr.
      currentKaderHabitIdx = -1;
      currentKaderHabit = h;
      openKaderNotificationWithHabit(h);
      return;
    }
    openKaderNotification(idx);
  };
  /* v5.7.15: NO auto-open fallback here anymore. The old 900ms
     DOMContentLoaded fallback called showAlarmBoard(0) — Fajr — whenever
     it raced ahead of onPageFinished, so the board showed the wrong
     task at noon. QuestAlarmActivity re-calls showBoard() with the
     REAL quest if the board is still not shown after 1500ms. */
</script>
</body>
</html>
