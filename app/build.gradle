apply plugin: 'com.android.application'

// Restore the fixed debug signing key from the committed base64 copy
// (the GitHub integration cannot edit workflow files, so the key is
// decoded here instead of in the workflow). Pure Java APIs only.
def keyB64File = file("../signing/debug.keystore.b64")
def keyFile = file("debug.keystore")
if (keyB64File.exists() && !keyFile.exists()) {
    String b64 = new String(java.nio.file.Files.readAllBytes(keyB64File.toPath()), "UTF-8").replaceAll("\\s", "")
    java.nio.file.Files.write(keyFile.toPath(), java.util.Base64.getDecoder().decode(b64))
}

// Restore the launcher icon foreground from the committed base64 copy
// (the GitHub integration pushes UTF-8 files only, so the PNG is decoded
// here instead of being committed as a binary — same pattern as the
// debug keystore above). Pure Java APIs only. Decoded on every build so
// a future icon swap regenerates automatically.
def iconB64File = file("../icon/ic_launcher_foreground.png.b64")
def iconPngFile = file("src/main/res/drawable/ic_launcher_foreground_png.png")
if (iconB64File.exists()) {
    String iconB64 = new String(java.nio.file.Files.readAllBytes(iconB64File.toPath()), "UTF-8").replaceAll("\\s", "")
    java.nio.file.Files.write(iconPngFile.toPath(), java.util.Base64.getDecoder().decode(iconB64))
}

// Restore the v5.6.7 photo artwork from the committed base64 copies
// (the GitHub integration pushes UTF-8 files only, so the JPEGs are decoded
// here instead of being committed as binaries — same pattern as the
// launcher icon and the debug keystore above). Pure Java APIs only.
// Decoded on every build so a future photo swap regenerates automatically.
def statusB64File = file("../photos/status-photo.jpg.b64")
def statusJpgFile = file("src/main/assets/status-photo.jpg")
if (statusB64File.exists()) {
    String statusB64 = new String(java.nio.file.Files.readAllBytes(statusB64File.toPath()), "UTF-8").replaceAll("\\s", "")
    java.nio.file.Files.write(statusJpgFile.toPath(), java.util.Base64.getDecoder().decode(statusB64))
}
def questB64File = file("../photos/quest-photo.jpg.b64")
def questJpgFile = file("src/main/assets/quest-photo.jpg")
if (questB64File.exists()) {
    String questB64 = new String(java.nio.file.Files.readAllBytes(questB64File.toPath()), "UTF-8").replaceAll("\\s", "")
    java.nio.file.Files.write(questJpgFile.toPath(), java.util.Base64.getDecoder().decode(questB64))
}

android {
    namespace 'com.kader.systemapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kader.systemapp'
        minSdk 24
        targetSdk 34
        versionCode 48
        versionName '5.6.7'
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "pkcs12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
