apply plugin: 'com.android.application'

android {
    namespace 'com.kader.systemapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kader.systemapp'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
